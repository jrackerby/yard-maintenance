[pytest]
# ROOTDIR IS THIS DIRECTORY ON PURPOSE, AND THE SUITE IS RUN FROM HERE.
# The directory above carries the integration's `__init__.py`, which imports
# `homeassistant` and `voluptuous`. Any collection tree that includes it makes
# a pytest Package node out of `yard_maintenance`, whose setup() imports that
# __init__.py -- and the whole suite then errors with ModuleNotFoundError
# before a line of it runs, on a suite whose entire point is that it needs no
# Home Assistant.
#
# `--import-mode=importlib` stops pytest walking up into the package, and
# test_tasks.py loads const.py and tasks.py by file path for the same reason.
# Between them, "the task table runs with no Home Assistant" is enforced by
# the harness rather than asserted in a comment.
#
# Run it as: cd tests && pytest      (tools/run_tests.sh does this)
addopts = --import-mode=importlib
