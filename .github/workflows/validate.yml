name: validate

# HACS and hassfest both move underneath a component. A repo that only
# validates on push goes quietly stale between commits, and a component like
# this one can sit untouched for months.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:

env:
  DOMAIN: yard_maintenance

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # hassfest, hacs and the shared tests/imports jobs run in
  # jrackerby/gha-workflows validate-integration.yml (workflow_call);
  # master's required contexts are "validate / <job>" (jrackerby/HA#821).
  validate:
    uses: jrackerby/gha-workflows/.github/workflows/validate-integration.yml@master
    with:
      domain: "yard_maintenance"
      public: true
